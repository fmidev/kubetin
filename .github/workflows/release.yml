# Driven by release-please (https://github.com/googleapis/release-please).
#
# Use conventional-commit subject lines on PR merges into main:
#   feat: new search-by-namespace shortcut
#   fix: stop crashing on empty kubeconfig
#   chore: bump dependencies
#
# release-please watches those, opens a PR titled "chore(main): release X.Y.Z"
# that contains the bumped CHANGELOG. Merging that PR tags + creates the
# GitHub Release; the build matrix below then attaches the binaries to it.
#
# Single workflow on purpose: GITHUB_TOKEN-driven tag pushes do NOT trigger
# other workflows, so we can't have a separate "on tag" workflow build the
# binaries. Doing it all in one workflow avoids the need for a personal
# access token.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: go

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # darwin builds run on macOS because codesign and notarytool only
    # exist there. Go itself would happily cross-compile them on Linux.
    runs-on: ${{ matrix.runner }}
    env:
      # Job-level so the sign step's `if:` can read it — a step's own
      # `env:` block is not in scope for that step's `if:`. This is what
      # keeps releases working (unsigned) before the secrets exist.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p dist
          base="kubetin-${{ needs.release-please.outputs.tag_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "BASE=$base" >> "$GITHUB_ENV"
          go build -trimpath -ldflags="-s -w" -o "dist/${base}/kubetin" ./cmd/kubetin
          cp LICENSE README.md "dist/${base}/"

      # Skipped entirely when the signing secrets aren't configured, so
      # a release still succeeds (unsigned) rather than failing closed.
      - name: sign and notarize
        if: matrix.goos == 'darwin' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          bin="dist/${BASE}/kubetin"

          # Import into a throwaway keychain rather than login.keychain:
          # the private key never outlives the job, and cleanup is a
          # single delete-keychain.
          kc_pwd="$(uuidgen)"
          security create-keychain -p "$kc_pwd" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$kc_pwd" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain

          printf %s "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f cert.p12
          # Without this, codesign blocks on a GUI keychain-access prompt
          # that nobody is there to answer, and the job hangs to timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_pwd" build.keychain >/dev/null

          # --options runtime (hardened runtime) is a hard prerequisite
          # for notarization; --timestamp is what keeps the signature
          # verifiable after the signing certificate itself expires.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # notarytool takes archives, not bare executables.
          # --norsrc --noextattr matter: the binary carries a
          # com.apple.provenance xattr, and a plain `ditto -c -k` turns
          # that into a second `._kubetin` AppleDouble entry inside the
          # zip we hand to Apple.
          printf %s "$AC_API_KEY_P8" | base64 --decode > ac_key.p8
          ditto -c -k --norsrc --noextattr "$bin" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key ac_key.p8 --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait --timeout 30m
          rm -f ac_key.p8 notarize.zip

          # Deliberately no `xcrun stapler`: it only works on bundles,
          # pkgs and dmgs, never a bare executable. The ticket stays on
          # Apple's servers and Gatekeeper fetches it on first launch,
          # which means that one launch has to be online.
          codesign -dv --verbose=4 "$bin" 2>&1 | grep -E 'Authority|TeamIdentifier' || true

      - name: package
        run: |
          set -euo pipefail
          # bsdtar emits ._ AppleDouble sidecars for anything carrying
          # extended attributes, which would otherwise ride along in the
          # macOS tarballs.
          export COPYFILE_DISABLE=1
          tar -czf "dist/${BASE}.tar.gz" -C dist "${BASE}"
          (cd dist && shasum -a 256 "${BASE}.tar.gz" > "${BASE}.tar.gz.sha256")
          rm -rf "dist/${BASE}"

      - name: delete signing keychain
        if: always() && matrix.goos == 'darwin'
        run: security delete-keychain build.keychain 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: kubetin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  upload:
    name: attach binaries to release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
